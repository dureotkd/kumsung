services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kumsung_enc
      POSTGRES_USER: kumsung
      POSTGRES_PASSWORD: kumsung_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumsung -d kumsung_enc"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
