spring:
  application:
    name: kumsung-enc-smart-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kumsung_enc}
    username: ${DB_USERNAME:kumsung}
    password: ${DB_PASSWORD:kumsung_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 210MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:system@localhost}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:10000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-provider: ${MAIL_PROVIDER:AUTO}
  mail-from: ${MAIL_FROM:${MAIL_USERNAME:system@localhost}}
  upload-dir: ${UPLOAD_DIR:./uploads}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root: ${UPLOAD_DIR:./uploads}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      prefix: ${S3_PREFIX:private}
  pdf-font: ${PDF_FONT:}
  quote-recipient: ${QUOTE_RECIPIENT:estimate@kumsungenc.co.kr}
  support-recipient: ${SUPPORT_RECIPIENT:B2B@kumsungenc.co.kr}
  support-email: ${SUPPORT_EMAIL:B2B@kumsungenc.co.kr}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  shop-admin:
    access-password: ${SHOP_ADMIN_ACCESS_PASSWORD:}
  toss-payments:
    secret-key: ${TOSS_SECRET_KEY:}
  email-outbox:
    enabled: ${EMAIL_OUTBOX_ENABLED:true}
    poll-ms: ${EMAIL_OUTBOX_POLL_MS:1000}
    batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:10}
  google-sheets:
    enabled: ${GOOGLE_SHEETS_ENABLED:false}
    webhook-url: ${GOOGLE_SHEETS_WEBHOOK_URL:}
    webhook-secret: ${GOOGLE_SHEETS_WEBHOOK_SECRET:}
    poll-ms: ${GOOGLE_SHEETS_POLL_MS:3000}
    batch-size: ${GOOGLE_SHEETS_BATCH_SIZE:10}
  malware:
    enabled: ${MALWARE_SCAN_ENABLED:false}
    required: ${MALWARE_SCAN_REQUIRED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:10000}
  privacy:
    version: ${PRIVACY_VERSION:2026-07-28}
    purpose: 견적 상담 및 고객 업무 서비스 제공
    unverified-retention-days: ${UNVERIFIED_RETENTION_DAYS:7}
    email-log-retention-days: ${EMAIL_LOG_RETENTION_DAYS:1095}
    inquiry-retention-days: ${INQUIRY_RETENTION_DAYS:1095}
    sheet-outbox-retention-days: ${SHEET_OUTBOX_RETENTION_DAYS:1095}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring.task.scheduling.pool.size: 2
