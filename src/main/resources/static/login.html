<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 | (주)금성이엔씨</title><link rel="stylesheet" href="/css/portal.css"><link rel="stylesheet" href="/css/company-brand.css"><link rel="stylesheet" href="/css/auth-fixes.css"><link rel="stylesheet" href="/css/portal-green.css"></head>
<body class="auth-page"><a class="auth-brand official-brand" href="/" aria-label="(주)금성이엔씨 홈"><span class="official-logo"><img src="/images/kumsung-enc-symbol.png" alt=""></span><img class="official-brand-wordmark official-brand-wordmark-korean" src="/images/kumsung-enc-ai-korean-wordmark.png" alt="(주)금성이엔씨"></a>
<main class="auth-card"><div class="auth-copy"><p>SMART CUSTOMER PORTAL</p><h1>견적부터 납품까지,<br>한눈에 확인하세요.</h1><ul><li>실시간 견적 진행상태</li><li>보완자료와 견적서 관리</li><li>계약·납품·A/S 통합 조회</li></ul></div>
<section class="auth-form"><div class="tabs"><button class="active" data-tab="login">로그인</button><button data-tab="register">회원가입</button></div>
<form id="login"><h2>로그인</h2><label>이메일<input type="email" name="username" autocomplete="username" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">로그인</button><div class="login-help"><a href="/reset-password.html">비밀번호를 잊으셨나요?</a></div></form>
<form id="register" hidden><h2>회원가입</h2><div class="two"><label>회사명<input name="companyName" required></label><label>담당자명<input name="name" required></label></div><label>연락처<input name="phone" required></label><label>이메일<input type="email" name="email" required></label><label>비밀번호 <small>12자 이상</small><input type="password" minlength="12" name="password" required></label><label class="privacy-check"><input type="checkbox" name="privacyAgreed" required><span><a href="/privacy.html" target="_blank">개인정보 처리방침</a>에 동의합니다.</span></label><button>회원가입</button><div class="verification-help"><p>이미 가입했지만 인증메일을 받지 못하셨나요?</p><button type="button" class="secondary-action" id="existingResendButton">인증 이메일 다시 받기</button></div></form>
<section id="registrationComplete" class="registration-complete" hidden aria-live="polite"><span class="completion-mark" aria-hidden="true">✓</span><h2>회원가입이 완료되었습니다.</h2><p><strong id="registeredEmail"></strong><span>주소로 인증 이메일을 발송했습니다.</span></p><p class="completion-guide">이메일에서 인증을 완료한 후 로그인해 주세요.<br>인증 주소는 24시간 동안 유효합니다.</p><button type="button" id="completionResendButton">인증 이메일 다시 보내기</button><button type="button" class="secondary-action" id="goToLoginButton">로그인 화면으로 이동</button></section>
<p id="authMessage"></p><a class="home-link" href="/">← 견적접수 화면으로</a></section></main>
<script src="/js/common.js"></script><script>
const tabButtons=document.querySelectorAll(".tabs button");
function showTab(tab,clearMessage=true){tabButtons.forEach(button=>button.classList.toggle("active",button.dataset.tab===tab));login.hidden=tab!=="login";register.hidden=tab!=="register";registrationComplete.hidden=true;if(clearMessage)authMessage.textContent=""}
tabButtons.forEach(button=>button.onclick=()=>showTab(button.dataset.tab));
const params=new URLSearchParams(location.search);const requestedPath=params.get("next");const requestedView=location.hash.slice(1);const allowedViews=new Set(["dashboard","quotes","shop","projects","contracts","deliveries","invoices","service","notices","support","privacy"]);const hashDestination=allowedViews.has(requestedView)?`/portal.html#${requestedView}`:"/portal.html";const loginDestination=requestedPath&&requestedPath.startsWith("/portal.html")?requestedPath:hashDestination;
login.onsubmit=async e=>{e.preventDefault();const button=login.querySelector('button[type="submit"]');button.disabled=true;authMessage.textContent="로그인 중입니다.";try{const c=await csrf(),body=new URLSearchParams(new FormData(login));const r=await fetch("/login",{method:"POST",headers:{[c.headerName]:c.token,"Content-Type":"application/x-www-form-urlencoded"},body});if(r.url.includes("error")){authMessage.textContent="이메일 또는 비밀번호를 확인해 주세요.";button.disabled=false;return}const serverDestination=new URL(r.url).pathname;if(serverDestination==="/admin.html"){location.replace("/admin.html");return}location.replace(loginDestination)}catch(e){authMessage.textContent="로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";button.disabled=false}};
if(params.get("verified")==="true")authMessage.textContent="이메일 인증이 완료되었습니다. 로그인해 주세요.";if(params.get("verified")==="false")authMessage.textContent="인증 주소가 만료되었거나 올바르지 않습니다.";
async function resendVerification(email){if(!email){authMessage.textContent="가입한 이메일을 입력해 주세요.";return}try{const result=await api("/api/auth/resend",{method:"POST",body:JSON.stringify({email})});authMessage.textContent=result.message}catch(x){authMessage.textContent=x.message}}
existingResendButton.onclick=()=>resendVerification(register.email.value);
completionResendButton.onclick=()=>resendVerification(registeredEmail.textContent);
goToLoginButton.onclick=()=>{showTab("login");login.username.value=registeredEmail.textContent;login.password.focus()};
register.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(register));d.privacyAgreed=register.privacyAgreed.checked;await api("/api/auth/register",{method:"POST",body:JSON.stringify(d)});registeredEmail.textContent=d.email;login.username.value=d.email;register.hidden=true;registrationComplete.hidden=false;authMessage.textContent=""}catch(x){authMessage.textContent=x.message}};
</script></body></html>
