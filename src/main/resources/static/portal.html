<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객 포털 | (주)금성이엔씨</title><link rel="stylesheet" href="/css/portal.css"><link rel="stylesheet" href="/css/portal-complete.css"><link rel="stylesheet" href="/css/pagination.css"><link rel="stylesheet" href="/css/portal-green.css"><link rel="stylesheet" href="/css/portal-brand.css"></head>
<body><div class="app"><aside class="sidebar"><a class="side-brand side-brand-official" href="/" aria-label="(주)금성이엔씨 메인 랜딩 페이지" title="메인 페이지로 이동"><span class="side-logo"><img src="/images/kumsung-enc-symbol.png" alt=""></span><span class="side-brand-copy"><img class="side-wordmark" src="/images/kumsung-enc-ai-korean-wordmark.png" alt="(주)금성이엔씨"><small>SMART PLATFORM</small></span></a><nav class="side-nav">
<button class="active" data-view="dashboard">대시보드</button><button data-view="quotes">견적관리</button><button data-view="shop">SMART SHOP 문의</button><button data-view="projects">프로젝트</button><button data-view="contracts">계약관리</button><button data-view="deliveries">납품현황</button><button data-view="invoices">세금계산서</button><button data-view="service">A/S 요청</button><button data-view="notices">공지사항</button><button data-view="support">고객센터</button><button data-view="privacy">개인정보 관리</button></nav><div class="side-bottom"><a href="/">＋ 새 견적 접수</a><a href="#" onclick="logout()">로그아웃</a></div></aside>
<main class="main"><header class="topbar"><h1 id="viewTitle">대시보드</h1><div class="user"><div class="avatar">K</div><div><strong id="userName">고객</strong><small id="companyName"></small></div></div></header>
<section id="dashboard" class="view active"><div class="stats"><div class="stat"><small>전체 견적</small><strong id="sQuotes">0</strong></div><div class="stat"><small>진행 중 견적</small><strong id="sActive">0</strong></div><div class="stat"><small>프로젝트</small><strong id="sProjects">0</strong></div><div class="stat"><small>담당자 메시지</small><strong id="sMessages">0</strong></div></div><div class="panel"><div class="panel-head"><h2>최근 견적</h2><button class="action" onclick="showView('quotes')">전체 보기</button></div><div id="recentQuotes"></div></div></section>
<section id="quotes" class="view"><div class="panel"><div class="panel-head"><h2>견적 접수현황 및 이력</h2><a class="action" href="/">새 견적</a></div><div id="quoteTable"></div></div></section>
<section id="shop" class="view"><div class="panel"><div class="panel-head"><h2>SMART SHOP 문의 내역</h2><a class="action" href="/shop.html">새 제품 문의</a></div><div id="shopInquiryTable"></div></div></section>
<section id="projects" class="view"><div class="panel"><h2>프로젝트 관리</h2><div id="projectCards" class="cards"></div></div></section>
<section id="contracts" class="view"><div class="panel"><h2>계약관리</h2><div id="contractTable"></div></div></section>
<section id="deliveries" class="view"><div class="panel"><h2>납품현황</h2><div id="deliveryTable"></div></div></section>
<section id="invoices" class="view"><div class="panel"><h2>세금계산서</h2><div id="invoiceTable"></div></div></section>
<section id="service" class="view"><div class="panel"><div class="panel-head"><h2>A/S 요청</h2><button class="action" onclick="openServiceDialog()">A/S 요청</button></div><div id="serviceTable"></div></div></section>
<section id="notices" class="view"><div class="panel"><h2>공지사항</h2><div id="noticeList"></div></div></section>
<section id="support" class="view"><div class="panel"><div class="panel-head"><h2>고객센터</h2><button class="action" onclick="supportDialog.showModal()">문의하기</button></div><div id="supportList"></div></div></section>
<section id="privacy" class="view"><div class="panel"><h2>개인정보 관리</h2><p>보관 중인 개인정보를 JSON 파일로 내려받거나 계정을 삭제할 수 있습니다.</p><button class="action" onclick="exportPrivacy()">내 데이터 내려받기</button><button class="action" style="color:#d33" onclick="deleteAccount()">계정 및 개인정보 삭제</button><p><a href="/privacy.html" target="_blank">개인정보 처리방침 보기</a></p></div></section>
</main></div>
<dialog id="detailDialog"><div class="modal" id="quoteDetail"></div></dialog>
<dialog id="serviceDialog"><form class="modal" id="serviceForm"><div class="modal-head"><h2>A/S 요청</h2><button type="button" onclick="serviceDialog.close()">×</button></div><label>관련 프로젝트<select name="projectId" id="serviceProject"><option value="">프로젝트 미지정</option></select></label><label>제목<input name="title" required></label><label>상세 내용<textarea name="details" rows="6" required></textarea></label><button class="primary">요청하기</button></form></dialog>
<dialog id="supportDialog"><form class="modal" id="supportForm"><div class="modal-head"><h2>고객센터 문의</h2><button type="button" onclick="supportDialog.close()">×</button></div><label>제목<input name="subject" required></label><label>문의 내용<textarea name="message" rows="6" required></textarea></label><button class="primary">문의하기</button></form></dialog>
<div class="toast" id="toast"></div><script src="/js/common.js"></script><script src="/js/portal.js"></script></body></html>
