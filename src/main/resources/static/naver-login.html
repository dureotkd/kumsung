<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>네이버 로그인 처리 중 | (주)금성이엔씨</title>
  <link rel="stylesheet" href="/css/portal.css">
  <link rel="stylesheet" href="/css/auth-fixes.css">
</head>
<body class="naver-processing-page">
  <main class="naver-processing-card" aria-live="polite" aria-busy="true">
    <span id="naverSpinner" class="naver-processing-spinner" aria-hidden="true"></span>
    <h1 id="naverTitle">네이버 로그인 처리 중입니다</h1>
    <p id="naverMessage">잠시만 기다려주세요.</p>
    <a id="naverReturn" class="naver-processing-return" href="/login.html" hidden>로그인 화면으로 돌아가기</a>
  </main>
  <script>
  (async()=>{
    const card=document.querySelector("main");
    const spinner=document.getElementById("naverSpinner");
    const title=document.getElementById("naverTitle");
    const message=document.getElementById("naverMessage");
    const returnLink=document.getElementById("naverReturn");
    const startedAt=Date.now();
    try{
      const response=await fetch("/api/auth/providers",{headers:{Accept:"application/json"},cache:"no-store"});
      if(!response.ok)throw new Error("provider_check_failed");
      const providers=await response.json();
      if(!providers.naver)throw new Error("naver_not_configured");
      const wait=Math.max(0,450-(Date.now()-startedAt));
      window.setTimeout(()=>location.replace("/oauth2/authorization/naver"),wait);
    }catch(error){
      const wait=Math.max(0,650-(Date.now()-startedAt));
      window.setTimeout(()=>{
        card.setAttribute("aria-busy","false");
        spinner.classList.add("is-stopped");
        title.textContent="네이버 로그인 준비 중입니다";
        message.textContent="네이버 연동 설정이 완료된 후 이용할 수 있습니다.";
        returnLink.hidden=false;
      },wait);
    }
  })();
  </script>
</body>
</html>
