<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="(주)금성이엔씨 비밀번호 재설정">
  <title>비밀번호 재설정 | (주)금성이엔씨</title>
  <link rel="stylesheet" href="/css/portal.css"><link rel="stylesheet" href="/css/company-brand.css"><link rel="stylesheet" href="/css/auth-fixes.css"><link rel="stylesheet" href="/css/portal-green.css">
</head>
<body class="verify-page reset-page">
  <a class="official-brand reset-brand" href="/" aria-label="(주)금성이엔씨 홈"><span class="official-logo"><img src="/images/kumsung-enc-symbol.png" alt=""></span><img class="official-brand-wordmark official-brand-wordmark-korean" src="/images/kumsung-enc-ai-korean-wordmark.png" alt="(주)금성이엔씨"></a>
  <main class="verify-card reset-card">
    <p class="reset-eyebrow">SECURE ACCOUNT RECOVERY</p>
    <section id="forgotSection">
      <h1>비밀번호 찾기</h1><p>가입한 이메일을 입력하면 비밀번호 재설정 주소를 보내드립니다. 고객과 관리자 계정 모두 사용할 수 있습니다.</p>
      <form id="forgotForm" class="reset-form"><label>이메일<input name="email" type="email" maxlength="120" autocomplete="email" required></label><button>재설정 이메일 받기</button></form>
    </section>
    <section id="resetSection" hidden>
      <h1>새 비밀번호 설정</h1><p>새 비밀번호는 12자 이상 72자 이하로 입력해 주세요.</p>
      <form id="resetForm" class="reset-form"><label>새 비밀번호<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>새 비밀번호 확인<input name="confirmPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><button>비밀번호 변경</button></form>
    </section>
    <p id="resetMessage" role="status"></p><a class="home-link" href="/login.html">로그인 화면으로 돌아가기</a>
  </main>
  <script src="/js/common.js"></script><script src="/js/reset-password.js"></script>
</body>
</html>
