<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 실패 | SMART SHOP</title><link rel="stylesheet" href="/css/synced-public.css"></head>
<body class="sync-public"><main class="payment-result-card"><span class="sync-payment-badge test">TEST PAYMENT</span><div class="payment-result-icon fail">!</div><h1>결제가 완료되지 않았습니다.</h1><p id="paymentFailMessage">결제가 취소되었거나 처리 중 문제가 발생했습니다.</p><dl><div><dt>오류 코드</dt><dd id="paymentFailCode">-</dd></div></dl><div class="payment-result-actions"><a href="/shop.html">다시 결제하기</a></div></main><script>const p=new URLSearchParams(location.search);paymentFailCode.textContent=(p.get("code")||"UNKNOWN").slice(0,100);paymentFailMessage.textContent=(p.get("message")||"결제가 취소되었거나 처리 중 문제가 발생했습니다.").slice(0,300);history.replaceState(null,"",location.pathname);</script></body></html>
